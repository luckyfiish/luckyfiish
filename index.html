<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>luckyfiish — Ocean &amp; Lucky Character Archive</title>
  <meta
    name="description"
    content="Không gian cá nhân Ocean & Lucky lưu trữ hồ sơ nhân vật, điểm danh cỏ 4 lá, phòng quay và thư viện minh họa."
  />
  <meta property="og:title" content="luckyfiish — Ocean & Lucky Character Archive" />
  <meta
    property="og:description"
    content="Không gian cá nhân Ocean & Lucky lưu trữ hồ sơ nhân vật, điểm danh cỏ 4 lá, phòng quay và thư viện minh họa."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: light;
      --font-display: "Quicksand", "Nunito", sans-serif;
      --font-sans: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink-primary: #0a2a43;
      --ink-secondary: #285270;
      --ink-muted: #4b7796;
      --ink-body: #1e4460;
      --lucky-clover: #15803d;
      --ocean-accent: #0284c7;
      --border-light: rgba(186, 230, 253, 0.75);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #dff4ff;
      background-image:
        radial-gradient(ellipse 90% 60% at 15% 0%, rgba(125, 211, 252, 0.48), transparent 65%),
        radial-gradient(ellipse 75% 55% at 85% 15%, rgba(110, 231, 183, 0.25), transparent 60%),
        radial-gradient(ellipse 65% 50% at 50% 90%, rgba(254, 240, 138, 0.24), transparent 65%),
        linear-gradient(180deg, #f2fbff 0%, #dcf4ff 52%, #caeefe 100%);
      background-attachment: fixed;
      color: var(--ink-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, a {
      font-family: inherit;
    }

    button {
      border: none;
      background: none;
      color: inherit;
    }

    .font-display {
      font-family: var(--font-display);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .hidden {
      display: none !important;
    }

    /* Frosted Glass UI */
    .glass-btn {
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.9);
      color: #0a2a43;
      box-shadow:
        0 6px 20px rgba(14, 116, 144, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition:
        background-color 180ms cubic-bezier(0.16, 1, 0.3, 1),
        border-color 180ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .glass-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(56, 189, 248, 0.75);
      transform: translateY(-1px);
      box-shadow:
        0 10px 26px rgba(14, 116, 144, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .glass-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .glass-btn-lucky {
      border-radius: 9999px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(167, 243, 208, 0.56));
      border: 1px solid rgba(255, 255, 255, 0.95);
      color: #073049;
      box-shadow:
        0 8px 26px rgba(14, 116, 144, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      transition:
        background 180ms cubic-bezier(0.16, 1, 0.3, 1),
        border-color 180ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .glass-btn-lucky:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(167, 243, 208, 0.82));
      border-color: rgba(52, 211, 153, 0.9);
      transform: translateY(-1px);
      box-shadow:
        0 12px 30px rgba(14, 116, 144, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .glass-btn-lucky:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .glass-panel {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 12px 34px rgba(14, 116, 144, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
    }

    /* Animations */
    @keyframes oceanFloat {
      0% { transform: translateY(0) translateX(0) rotate(0deg); }
      50% { transform: translateY(-20px) translateX(10px) rotate(10deg); }
      100% { transform: translateY(0) translateX(0) rotate(0deg); }
    }

    @keyframes blingTwinkle {
      0%, 100% { opacity: 0.45; transform: scale(0.85) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.22) rotate(22deg); }
    }

    @keyframes burstPop {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      60% { opacity: 0.95; transform: translate(-50%, -85%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -125%) scale(0.85); }
    }

    @keyframes eqBar {
      0%, 100% { transform: scaleY(0.32); }
      50% { transform: scaleY(1); }
    }

    @keyframes noteFloat {
      0% { opacity: 0; transform: translateY(6px) scale(0.75) rotate(-8deg); }
      30% { opacity: 0.95; }
      100% { opacity: 0; transform: translateY(-28px) translateX(8px) scale(1.1) rotate(12deg); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes luckyThreePop {
      0%, 100% {
        transform: translateY(0) scale(1) rotate(-3deg);
        box-shadow: 0 0 12px rgba(250, 204, 21, 0.55), 0 0 24px rgba(56, 189, 248, 0.35);
      }
      50% {
        transform: translateY(-2px) scale(1.14) rotate(3deg);
        box-shadow: 0 0 20px rgba(250, 204, 21, 0.85), 0 0 34px rgba(52, 211, 153, 0.55);
      }
    }

    .animate-ocean-float {
      animation: oceanFloat var(--float-duration, 9s) ease-in-out infinite;
      animation-delay: var(--float-delay, 0s);
    }

    .animate-bling {
      animation: blingTwinkle var(--bling-duration, 3.4s) ease-in-out infinite;
      animation-delay: var(--bling-delay, 0s);
    }

    .animate-burst {
      animation: burstPop 920ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-eq-bar {
      transform-origin: bottom;
      animation: eqBar var(--eq-dur, 0.85s) ease-in-out infinite;
      animation-delay: var(--eq-delay, 0s);
    }

    .animate-note-float {
      animation: noteFloat 2.4s ease-out infinite;
      animation-delay: var(--note-delay, 0s);
    }

    .animate-lucky-three {
      animation: luckyThreePop 2.1s ease-in-out infinite;
    }

    /* Ocean Atmosphere Layer */
    .atmosphere-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    .atmosphere-layer.scoped {
      position: absolute;
      z-index: 20;
    }

    .cursor-halo {
      position: fixed;
      width: 224px;
      height: 224px;
      border-radius: 9999px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(254, 240, 138, 0.22) 0%, rgba(125, 211, 252, 0.14) 45%, transparent 70%);
      pointer-events: none;
    }

    .ocean-bubble {
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(2px);
      box-shadow:
        inset -4px -4px 10px rgba(56, 189, 248, 0.24),
        inset 3px 3px 8px rgba(255, 255, 255, 0.92),
        0 4px 16px rgba(14, 116, 144, 0.1);
    }

    /* Header Navbar */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 24px rgba(14, 116, 144, 0.08);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .clover-badge {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: default;
    }

    .clover-badge:hover {
      transform: none;
    }

    .name-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      max-width: 150px;
    }

    .name-pill span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-desktop {
      display: none;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-desktop button {
      padding: 4px 0;
      cursor: pointer;
      white-space: nowrap;
      transition: color 150ms;
      color: var(--ink-secondary);
    }

    .nav-desktop button:hover {
      color: var(--ink-primary);
      text-decoration: underline;
      text-underline-offset: 8px;
    }

    .nav-desktop button.active {
      color: var(--ocean-accent);
      text-decoration: underline;
      text-underline-offset: 8px;
      text-decoration-thickness: 2px;
    }

    .brand-btn {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 150ms;
    }

    .brand-btn:hover {
      color: var(--ocean-accent);
    }

    .nav-mobile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px 10px;
      overflow-x: auto;
    }

    .nav-mobile button {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .header-inner { padding: 0 24px; }
      .nav-desktop { display: flex; }
      .nav-mobile { display: none; }
      .brand-btn { font-size: 24px; }
    }

    /* Main Container */
    main.site-main {
      position: relative;
      z-index: 10;
      flex: 1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .container-gallery {
      max-width: 1040px;
      margin: 0 auto;
      padding: 36px 20px;
    }

    @media (min-width: 640px) {
      .container { padding: 32px 24px; }
      .container-gallery { padding: 40px 24px; }
    }

    /* Homepage Corner Check-in & Search */
    .home-top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .home-rates {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .checkin-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .filter-card {
      border-radius: 24px;
      padding: 16px 20px;
      margin-bottom: 28px;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-muted);
      pointer-events: none;
      display: flex;
    }

    .pill-input {
      width: 100%;
      padding: 9px 16px;
      font-size: 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #ffffff;
      color: var(--ink-primary);
      outline: none;
      transition: border-color 150ms;
    }

    .pill-input:focus {
      border-color: var(--ocean-accent);
    }

    .pill-input::placeholder {
      color: var(--ink-muted);
    }

    .search-input {
      padding-left: 42px;
    }

    .tags-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(14, 116, 144, 0.1);
    }

    .tag-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .clear-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ocean-accent);
      cursor: pointer;
    }

    .clear-filter-btn:hover {
      text-decoration: underline;
    }

    /* Section Headings */
    .section-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      margin: 0 0 20px;
    }

    @media (min-width: 640px) {
      .section-title.hero { font-size: 36px; }
      .section-title { font-size: 30px; }
    }

    .divider {
      border: 0;
      border-top: 1px solid rgba(14, 116, 144, 0.25);
      margin: 32px 0;
    }

    /* Character Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    @media (min-width: 640px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .char-card {
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: left;
      cursor: pointer;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1), border-color 200ms;
    }

    .char-card:hover {
      transform: translateY(-4px);
      border-color: #ffffff;
    }

    .char-card.featured {
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .char-card.featured {
        grid-template-columns: 5fr 7fr;
      }
    }

    .char-thumb {
      position: relative;
      overflow: hidden;
      background: #d6f1fe;
      aspect-ratio: 3 / 4;
      width: 100%;
    }

    .char-card.featured .char-thumb {
      min-height: 360px;
    }

    .char-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .char-card:hover .char-thumb img {
      transform: scale(1.03);
    }

    .portrait-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #d6f1fe;
      color: var(--ink-secondary);
      padding: 20px;
      text-align: center;
      user-select: none;
    }

    .char-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      flex: 1;
    }

    @media (min-width: 640px) {
      .char-card.featured .char-body { padding: 32px; }
    }

    .char-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .char-name {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--ink-primary);
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      transition: color 150ms;
    }

    .char-card.featured .char-name {
      font-size: 32px;
    }

    @media (min-width: 640px) {
      .char-card.featured .char-name { font-size: 36px; }
    }

    .char-card:hover .char-name {
      color: var(--ocean-accent);
    }

    .char-desc {
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--ink-secondary);
      margin: 2px 0 0;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 6px;
    }

    .inline-tag-btn {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-primary);
      cursor: pointer;
      padding: 0;
    }

    .inline-tag-btn:hover {
      color: var(--ocean-accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Gallery 3-Column Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (min-width: 640px) {
      .gallery-grid { gap: 20px; }
    }

    @media (min-width: 1024px) {
      .gallery-grid { gap: 24px; }
    }

    .gallery-card {
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 200ms, border-color 200ms;
    }

    @media (min-width: 640px) {
      .gallery-card { border-radius: 24px; }
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      border-color: #ffffff;
    }

    .gallery-thumb {
      aspect-ratio: 4 / 5;
      width: 100%;
      overflow: hidden;
      background: #d6f1fe;
    }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 200ms;
    }

    .gallery-card:hover .gallery-thumb img {
      transform: scale(1.03);
    }

    .gallery-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .gallery-body { padding: 16px; gap: 12px; }
    }

    /* Wheel Section */
    .wheel-panel {
      position: relative;
      border-radius: 24px;
      padding: 24px;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .wheel-panel { padding: 40px; }
    }

    .wheel-layout {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .wheel-layout { grid-template-columns: 1fr 1fr; }
    }

    .wheel-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid #0284c7;
      filter: drop-shadow(0 4px 10px rgba(2, 132, 199, 0.35));
    }

    .wheel-disc {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
      border: 2px solid #ffffff;
      box-shadow: 0 20px 50px rgba(14, 116, 144, 0.18);
    }

    .lucky-three-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      margin: 0 2px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #fef08a, #a7f3d0, #bae6fd);
      border: 1px solid #ffffff;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      color: var(--ink-primary);
      vertical-align: middle;
    }

    /* Fiish Layout */
    .fiish-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (min-width: 1024px) {
      .fiish-grid { grid-template-columns: 7fr 5fr; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding-top: 12px;
      border-top: 1px solid rgba(14, 116, 144, 0.15);
    }

    /* Modals & Overlays */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.transparent {
      background: transparent;
    }

    .modal-backdrop.dimmed {
      background: rgba(214, 240, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .gate-card {
      width: 100%;
      max-width: 520px;
      border-radius: 24px;

  <script>
    (function () {

      // =========================================================================
      // 1. DỮ LIỆU NHÂN VẬT & THÔNG TIN TÁC GIẢ
      // =========================================================================
      // Bạn có thể thêm nhân vật mới vào mảng CHARACTERS hoặc nhân vật hiếm vào RARE_CHARACTERS.
      // Nếu muốn thêm nhiều ảnh cho một nhân vật, thêm thuộc tính galleryImages: ['url1', 'url2'].
      var CHARACTERS = [
        {
          id: 'luc-van-chi',
          code: '1',
          name: 'Lục Vân Chi',
          age: '21',
          gender: 'Nam',
          role: 'Chủ sự Vân Thước Trai',
          group: 'Tự tạo',
          tags: ['BL', 'Age Gap', 'Niên Hạ', 'Miêu Cương', 'Slice of Life'],
          appearance:
            'Dáng người thon dài, mái tóc đen mượt dài chấm lưng buộc hờ bằng dải ruy băng lụa màu chàm, đôi mắt hạnh trong trẻo nhưng sâu thẳm và hai lúm đồng tiền mờ bên khóe môi. Y phục truyền thống cách tân: áo vạt chéo màu lam thẫm dệt sợi bông thô thêu hoa văn mây cuộn chỉ bạc, thắt lưng lụa sóng nước đính chuỗi ba chiếc chuông bạc cổ khắc hoa văn phù dung.',
          backstory:
            'Sương mù ở Miêu Cương không tan đi theo ánh bình minh như ở đồng bằng. Cứ mỗi độ chớm thu, khi những vạt rừng phong trên đỉnh Nguyệt Lạc bắt đầu ửng sắc đỏ thẫm, lớp sương sớm ấy lại đặc quánh như sữa, lãng đãng trườn qua những mái ngói âm dương rêu phong, vương lại trên từng kẽ lá trà hoang rồi ngưng tụ thành những giọt nước mát lạnh.\n\n' +
            'Giữa thung lũng lòng chảo bốn bề vách đá dựng đứng, bản Trại Yên Thủy hiện ra như một nét mực loang mờ ảo trong tranh thủy mặc. Nơi đây cách biệt với phố thị ồn ào bằng cả một cung đường đèo hiểm trở, nhưng những ngày này, sự tĩnh mịch thường nhật đã bị phá vỡ bởi không khí náo nức chuẩn bị cho "Lễ Hoa Cương" — một trong những nghi lễ truyền thống lớn nhất trong năm của người Miêu bản địa, nơi những điệu múa khèn, sắc áo thêu chỉ ngũ sắc và những chén rượu ngô nồng đượm sẽ thắp sáng cả núi rừng thâm u suốt ba ngày ba đêm.\n\n' +
            'Nằm tựa lưng vào sườn đồi thoai thoải nhìn thẳng xuống dòng suối Ngân Khê trong vắt là "Vân Thước Trai" — khu nghỉ dưỡng bằng gỗ hồng sắc kết hợp kiến trúc nhà sàn truyền thống độc đáo nhất vùng.\n\n' +
            'Lúc này, trời vừa hửng sáng.\n\n' +
            'Từ trên gác lửng của viện sau, một bóng người thon dài khẽ đẩy cánh cửa sổ chạm lộng hoa văn dây leo. Gió sớm ùa vào, thổi lay động dải ruy băng lụa màu chàm đang buộc hờ mái tóc đen mượt dài chấm lưng của Lục Vân Chi.\n\n' +
            'Hôm nay là ngày mở màn đón đợt khách phương xa đổ về dự hội, Vân Chi không mặc âu phục hiện đại mà chọn một bộ y phục truyền thống cách tân do chính tay các thợ thêu lành nghề trong bản may riêng cho cậu. Áo vạt chéo màu lam thẫm dệt bằng sợi bông thô tự nhiên, viền cổ và cổ tay thêu hoa văn mây cuộn bằng chỉ bạc tinh xảo. Thắt lưng bằng lụa dệt hoa văn hình sóng nước, bên hông đính một chuỗi ba chiếc chuông bạc cổ khắc chìm hoa văn phù dung. Mỗi khi cậu cất bước, những chiếc chuông lại va vào nhau, phát ra những tiếng leng keng vô cùng êm tai, thanh thoát như tiếng nước suối róc rách qua khe đá.\n\n' +
            'Vân Chi đưa tay vuốt lại nếp áo, ánh mắt lơ đãng nhìn xuống sân dưới. Nhưng trước khi xoay người rời khỏi phòng, bước chân cậu khẽ khựng lại bên chiếc bàn gỗ lim đặt ở góc khuất nhất của gian trà thất.\n\n' +
            'Nơi đó, dưới bóng râm của bức rèm trúc dày, có đặt một chiếc hũ gốm tráng men đen nhánh, miệng hũ được niêm phong bằng một mảnh vải đỏ thêu phù chú bằng chỉ đen chìm.\n\n' +
            'Vân Chi vươn những ngón tay trắng nõn, thon dài chạm khẽ vào thân hũ lạnh ngắt. Đôi mắt vốn trong trẻo, thơ ngây kia trong chớp mắt bỗng trầm xuống, sâu thẳm và lạnh lùng như giếng cổ ngàn năm không một gợn sóng. Bên trong hũ, dường như cảm nhận được hơi ấm quen thuộc từ đầu ngón tay chủ nhân, có thứ gì đó rất nhỏ bé đang khẽ cào nhẹ vào thành gốm, phát ra chuỗi âm thanh ma sát rợn người.\n\n' +
            '"Ngoan nào..." — Vân Chi khẽ mấp máy môi, thanh âm trầm thấp, phẳng lặng đến mức tàn nhẫn, hoàn toàn khác hẳn với vẻ ngọt ngào thường ngày — "Hôm nay có rất nhiều người lạ đến bản. Đừng có làm loạn."\n\n' +
            'Chiếc hũ gốm lập tức im bặt, như thể sinh vật bên trong thấu hiểu từng sợi uy áp vô hình tỏa ra từ huyết mạch của thiếu niên.\n\n' +
            'Vân Chi là cháu đích tôn của thôn trưởng bản Trại Yên Thủy. Người ngoài nhìn vào chỉ thấy cậu là một thiếu gia nhỏ ngoan ngoãn, hiểu chuyện, được cả bản yêu thương, lại giỏi giang mở được khu nghỉ dưỡng đón khách du lịch giúp dân bản có thêm thu nhập. Nhưng trong huyết quản của chàng trai có nụ cười ngọt ngào như mật ấy đang kế thừa những bí thuật luyện Cổ cổ xưa và nguy hiểm nhất mà gia tộc họ Lục phong kín qua nhiều thế hệ.\n\n' +
            'Khi tiếng bước chân vội vã vang lên từ hành lang gỗ bên ngoài, sự lạnh lẽo trong mắt Vân Chi biến mất không còn một dấu vết, nhanh đến mức như thể nó chưa từng tồn tại.\n\n' +
            '"Tiểu Vân Chi! Cậu chủ nhỏ ơi!"\n\n' +
            'A Tang — người quản lý trẻ tuổi của khu nghỉ dưỡng, vừa thở hổn hển vừa chạy vào, trên tay cầm xấp danh sách phòng dày cộm. Nhìn thấy Vân Chi đang mỉm cười đứng bên bàn trà, A Tang bất giác gãi đầu, nét căng thẳng trên mặt cũng dịu đi mấy phần:\n\n' +
            '"Chuyến xe khách liên tỉnh đầu tiên từ ngoài huyện đã qua trạm kiểm soát dưới chân đèo rồi. Tầm mười lăm phút nữa là tới cổng sơn trang. Trưởng thôn vừa gọi điện sang dặn cậu phải chú ý đón tiếp, năm nay lượng khách đăng ký trải nghiệm nghi lễ ban đêm đông gấp đôi năm ngoái đấy."\n\n' +
            '"A Tang, anh đừng vội mà, uống ngụm trà sương sớm em vừa pha này đã." — Vân Chi nghiêng đầu, nở một nụ cười rạng rỡ, hai lúm đồng tiền mờ mờ ẩn hiện bên khóe môi. Cậu nhẹ nhàng bưng chén trà hoa cúc dại đưa cho người quản lý, giọng điệu mềm mỏng, mang theo chút nũng nịu vô hại của một cậu em trai nhỏ — "Em đã kiểm tra lại từng phòng ở Thính Vũ Các và Trúc Lâm Uyển từ hôm qua rồi, trà bánh đón khách cũng bảo nhà bếp chuẩn bị xong cả. Anh đừng lo lắng quá, có gì cần thì cứ bảo em một tiếng là được."\n\n' +
            '"Cậu chu đáo thế này thì ai mà lo cho nổi chứ." A Tang uống cạn chén trà, cảm thấy cả người khoan khoái, không nhịn được mà cười lớn, "Thôi, tôi ra cổng trước để chỉ dẫn cho xe đỗ vào bãi. Lát nữa cậu xuống sảnh lớn nhận diện khách VIP nhé."\n\n' +
            '"Vâng, em ra ngay đây ạ."\n\n' +
            'Vân Chi ngoan ngoãn gật đầu, đợi A Tang rời đi rồi mới thong thả bước xuống cầu thang gỗ. Từng bậc thang vang lên tiếng cọt kẹt trầm ấm của gỗ lâu năm, hòa cùng tiếng chuông bạc lanh lảnh bên hông cậu.\n\n' +
            'Sân trước của Vân Thước Trai lúc này đã bắt đầu nhộn nhịp. Những chậu hoa đỗ quyên rừng đỏ rực được xếp dọc theo lối đi lát đá xanh dẫn từ cổng chào bằng gỗ mun vào tận đại sảnh. Mùi hương gỗ thông, mùi trầm hương phảng phất cùng tiếng đàn tính tẩu của mấy cô gái Miêu đang tập dượt ngoài sân tạo nên một bầu không khí đậm chất phong tình bản địa.\n\n' +
            'Đúng lúc đó, một chiếc xe màu đen từ tốn lăn bánh qua cánh cổng gỗ lớn, dừng lại ngay trước bậc tam cấp dẫn lên tiền sảnh.\n\n' +
            'Cửa xe mở ra, một bóng người bước xuống.\n\n' +
            'Không gian xung quanh dường như bất giác lắng lại một nhịp.\n\n' +
            'Giữa khung cảnh núi rừng mộc mạc và sương khói mờ ảo, người vừa bước xuống mang một khí chất hoàn toàn tách biệt khỏi chốn trần tục này. Ngũ quan của người nọ tinh tế, thanh tú đến mức hoàn mỹ. Vân Chi đang đứng bên bậu cửa tiền sảnh, bàn tay đang chỉnh lại chuỗi hạt dâu tằm trên khay trà bỗng khựng lại.\n\n' +
            'Đôi mắt hạnh của thiếu niên hơi mở to, ánh nhìn dừng lại trên người {{user}}.\n\n' +
            'Trong đáy mắt Vân Chi xẹt qua một tia sáng tò mò đầy thích thú, nhanh như một vệt sao băng rồi lập tức được che giấu dưới vẻ mặt ngơ ngác, thuần khiết của một thiếu niên miền sơn cước hiếu khách.\n\n' +
            'Cậu đặt khay trà xuống bàn tiếp tân, khẽ vén vạt áo chàm rồi bước nhanh xuống những bậc tam cấp bằng đá xanh ẩm ướt hơi sương. Tiếng chuông bạc leng keng rộn ràng theo từng bước chân nhỏ nhắn, phá tan sự tĩnh lặng của buổi sáng vùng cao.\n\n' +

              'px,' +
              (yOff + yPtr).toFixed(1) +
              'px,0) rotate(' +
              rot.toFixed(1) +
              'deg)';

              b.style.position = 'fixed';
              b.style.left = e.clientX + o.dx + 'px';
              b.style.top = e.clientY + o.dy + 'px';
              b.innerHTML =
                o.kind === 'bling'
                  ? blingSvg(24)
                  : o.kind === 'clover'
                  ? cloverSvg(22)
                  : '<div style="width:20px;height:20px;border-radius:9999px;background:rgba(255,255,255,0.65);border:1px solid #fff;"></div>';
              host.appendChild(b);
              window.setTimeout(function () {
                if (b.parentNode) b.parentNode.removeChild(b);
              }, 950);
            });
          },
          { passive: true }
        );
      }

      // =========================================================================
      // 5. LOGIC NGHIỆP VỤ (NHÂN VẬT, ĐIỂM DANH, MẬT KHẨU, VÒNG QUAY)
      // =========================================================================
      function getVisibleRosterPool() {
        var unlockedRares = RARE_CHARACTERS.filter(function (r) {
          return state.unlockedIds.indexOf(r.id) !== -1;
        });
        return CHARACTERS.concat(unlockedRares);
      }

      function getAllTags() {
        var seen = {};
        var list = [];
        getVisibleRosterPool().forEach(function (c) {
          c.tags.forEach(function (t) {
            if (!seen[t]) {
              seen[t] = true;
              list.push(t);
            }
          });
        });
        return list;
      }

      function isCheckedInRecently() {
        return state.lastCheckInAt > 0 && Date.now() - state.lastCheckInAt < TWENTY_FOUR_HOURS_MS;
      }

      function isOver24Hours() {
        return state.lastCheckInAt > 0 && Date.now() - state.lastCheckInAt >= TWENTY_FOUR_HOURS_MS;
      }

      function handleCheckIn() {
        if (isCheckedInRecently()) return;
        state.lastCheckInAt = Date.now();
        state.clovers += 2;
        state.toastDismissed = true;
        persistAll();
        renderAll();
      }

      function handleUnlockCharacter(id) {
        var target = ALL_CHARACTERS.find(function (c) {
          return c.id === id;
        });
        if (!target) return;
        var cost = target.isRare ? 25 : 1;
        if (state.unlockedIds.indexOf(id) !== -1 || state.clovers < cost) return;
        state.clovers = Math.max(0, state.clovers - cost);
        state.unlockedIds.push(id);
        if (state.ownedImageIds.indexOf(id) === -1) state.ownedImageIds.push(id);
        persistAll();
        renderAll();
      }

      function handleVisitUnlockLink(id) {
        if (state.visitedUnlockLinkIds.indexOf(id) === -1) {
          state.visitedUnlockLinkIds.push(id);
          persistAll();
          renderDetailModal();
          if (state.activeTab === 'thu-vien') renderMain();
        }
      }

      function verifyPassword(id, password) {
        var target = ALL_CHARACTERS.find(function (c) {
          return c.id === id;
        });
        if (!target) return { ok: false, message: 'Không tìm thấy hồ sơ.' };
        var trimmed = String(password || '').trim();
        if (!trimmed || trimmed !== target.linkPassword) {
          return {
            ok: false,
            message: 'Sai rồi, hãy nhìn kỹ và dựa vào gợi ý',
          };
        }
        if (state.linkVerifiedIds.indexOf(id) === -1) {
          state.linkVerifiedIds.push(id);
          persistAll();
        }
        return { ok: true };
      }

      function handleToggleTag(tag) {
        var idx = state.selectedTags.indexOf(tag);
        if (idx === -1) state.selectedTags.push(tag);
        else state.selectedTags.splice(idx, 1);
        state.activeTab = 'nhan-vat';
        state.selectedId = null;
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function handleToggleLike(id) {
        var liked = Boolean(state.likes.likedByMe[id]);
        var count = state.likes.counts[id] || 0;
        state.likes.counts[id] = Math.max(0, count + (liked ? -1 : 1));
        state.likes.likedByMe[id] = !liked;
        persistAll();
        renderDetailModal();
        if (state.activeTab === 'nhan-vat' || state.activeTab === 'fiish') renderMain();
      }

      function handleAddComment(id, content) {
        var clean = String(content || '').trim();
        if (!clean) return;
        var list = state.commentsByChar[id] || [];
        list.unshift({
          id: 'cmt-' + Date.now(),
          author: (state.userName || '').trim() || 'Khách ghé thăm',
          content: clean,
          createdAt: Date.now(),
        });
        state.commentsByChar[id] = list;
        persistAll();
        renderDetailModal();
        if (state.activeTab === 'fiish') renderMain();
      }

      // =========================================================================
      // 6. VÒNG QUAY ĐẠI DƯƠNG (TỶ LỆ ẨN 30 / 25 / 15 / 5)
      // =========================================================================
      var WHEEL_SEGMENTS = [
        { label: '+1 🍀', type: 'clover-1', color: '#E0F2FE' },
        { label: 'Gói Nhân Vật', type: 'character-pack', color: '#BAE6FD' },
        { label: '+2 🍀', type: 'clover-2', color: '#CFEFFE' },
        { label: 'Gói Ảnh', type: 'image-pack', color: '#A7F3D0' },
        { label: '+1 🍀', type: 'clover-1', color: '#E0F2FE' },
        { label: '+5 🍀', type: 'clover-5', color: '#FEF9C3' },
        { label: 'Gói Nhân Vật', type: 'character-pack', color: '#93C5FD' },
        { label: 'Gói Nhân Vật Hiếm', type: 'rare-character-pack', color: '#FDE68A' },
      ];

      function rollSecretWheelOutcome() {
        var totalWeight = 30 + 25 + 15 + 5;
        var roll = Math.random() * totalWeight;
        if (roll < 30) return 'clover-1';
        if (roll < 55) return Math.random() < 0.5 ? 'clover-2' : 'character-pack';
        if (roll < 70) return Math.random() < 0.5 ? 'clover-5' : 'image-pack';
        return 'rare-character-pack';
      }

      function polarToCartesian(cx, cy, r, angleDeg) {
        var rad = ((angleDeg - 90) * Math.PI) / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
      }

      function describeSlice(cx, cy, r, startAngle, endAngle) {
        var start = polarToCartesian(cx, cy, r, endAngle);
        var end = polarToCartesian(cx, cy, r, startAngle);
        var largeArc = endAngle - startAngle <= 180 ? '0' : '1';
        return 'M ' + cx + ' ' + cy + ' L ' + start.x + ' ' + start.y + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 0 ' + end.x + ' ' + end.y + ' Z';
      }

      function executeWheelSpin() {
        if (state.isSpinning || state.clovers < 5) return;
        var rolls = [rollSecretWheelOutcome(), rollSecretWheelOutcome(), rollSecretWheelOutcome()];
        var primaryType = rolls[0];
        var matching = [];
        WHEEL_SEGMENTS.forEach(function (seg, idx) {
          if (seg.type === primaryType) matching.push(idx);
        });
        var chosenIndex = matching.length > 0 ? matching[Math.floor(Math.random() * matching.length)] : 0;

        var pickRandom = function (pool) {
          return pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : null;
        };

        var netDelta = -5;
        var unlockedBatch = [];
        var imageBatch = [];
        var resultItems = [];

        rolls.forEach(function (segType, idx) {
          var uid = 'spin-' + Date.now() + '-' + idx;
          if (segType === 'rare-character-pack') {
            var unowned = RARE_CHARACTERS.filter(function (r) {
              return state.unlockedIds.indexOf(r.id) === -1 && unlockedBatch.indexOf(r.id) === -1;
            });
            var rareChar = pickRandom(unowned.length > 0 ? unowned : RARE_CHARACTERS);
            if (rareChar) {
              unlockedBatch.push(rareChar.id);
              imageBatch.push(rareChar.id);
              resultItems.push({ id: uid, character: rareChar, isRare: true, label: 'Gói Nhân Vật Hiếm' });
            } else {
              resultItems.push({ id: uid, isRare: true, label: 'Gói Nhân Vật Hiếm (chưa có nhân vật hiếm)' });
            }
            return;
          }
          if (segType === 'character-pack') {
            var ch = pickRandom(CHARACTERS);
            if (ch) {
              unlockedBatch.push(ch.id);
              imageBatch.push(ch.id);
              resultItems.push({ id: uid, character: ch, isRare: false, label: 'Gói Nhân Vật · Mở khóa link' });
            } else {
              resultItems.push({ id: uid, isRare: false, label: 'Gói Nhân Vật (chưa có nhân vật)' });
            }
            return;
          }
          if (segType === 'image-pack') {
            var chImg = pickRandom(CHARACTERS);
            if (chImg) {
              imageBatch.push(chImg.id);
              resultItems.push({ id: uid, character: chImg, isRare: false, label: 'Gói Ảnh · Ảnh nhân vật' });
            } else {
              resultItems.push({ id: uid, isRare: false, label: 'Gói Ảnh (chưa có nhân vật)' });
            }
            return;
          }
          var gain = segType === 'clover-5' ? 5 : segType === 'clover-2' ? 2 : 1;
          netDelta += gain;
          resultItems.push({ id: uid, cloverGain: gain, isRare: false, label: 'Cỏ 4 lá may mắn' });
        });

        state.clovers = Math.max(0, state.clovers + netDelta);
        unlockedBatch.forEach(function (id) {
          if (state.unlockedIds.indexOf(id) === -1) state.unlockedIds.push(id);
        });
        imageBatch.forEach(function (id) {
          if (state.ownedImageIds.indexOf(id) === -1) state.ownedImageIds.push(id);
        });
        persistAll();

        var sliceAngle = 360 / WHEEL_SEGMENTS.length;
        var extraTurns = 5 * 360;
        var sliceCenter = chosenIndex * sliceAngle + sliceAngle / 2;
        var targetMod = (360 - sliceCenter + 360) % 360;
        var currentMod = ((state.wheelRotation % 360) + 360) % 360;
        var delta = (targetMod - currentMod + 360) % 360;
        state.wheelRotation += extraTurns + delta;
        state.isSpinning = true;

        renderNavbar();
        var disc = document.getElementById('wheel-disc-el');
        var spinBtn = document.getElementById('wheel-spin-btn');
        var cloverHint = document.getElementById('wheel-clover-hint');
        if (disc) {
          disc.style.transition = 'transform 4.2s cubic-bezier(0.14, 0.85, 0.22, 1)';
          disc.style.transform = 'rotate(' + state.wheelRotation + 'deg)';
        }
        if (spinBtn) {
          spinBtn.disabled = true;
          spinBtn.innerHTML = icon('rotate', 16, 'style="animation:spin 1s linear infinite;"') + '<span>Đang quay...</span>';
        }
        if (cloverHint) {
          cloverHint.textContent = 'Hiện có: ' + state.clovers + ' 🍀';
        }

        window.setTimeout(function () {
          state.isSpinning = false;
          state.lastWheelResult = {
            segmentLabel: '3 vật phẩm ' + (state.userName || 'bạn') + ' nhận được',
            items: resultItems,
          };
          renderMain();
        }, 4200);
      }

      // =========================================================================

      // =========================================================================
      function renderNavbar() {
        document.getElementById('nav-clovers').textContent = state.clovers + ' 🍀';
        document.getElementById('nav-name-icon').innerHTML = icon('user', 14);
        document.getElementById('nav-name-text').textContent = state.userName || 'Đặt tên';

          btn.classList.toggle('active', btn.getAttribute('data-tab') === state.activeTab);

        document.querySelectorAll('.nav-mobile button[data-tab]').forEach(function (btn) {

          btn.className = active ? 'glass-btn-lucky' : 'glass-btn';
          btn.style.color = active ? '#073049' : '#285270';

          '</div>' +
          '<button type="button" id="toast-close-btn" class="glass-btn" style="padding:6px;" aria-label="Đóng thông báo">' +

      function renderWheelTab(container) {
        var sliceCount = WHEEL_SEGMENTS.length;
        var sliceAngle = 360 / sliceCount;
        var slicesSvg = WHEEL_SEGMENTS.map(function (seg, idx) {
          var startAngle = idx * sliceAngle;
          var endAngle = startAngle + sliceAngle;
          var midAngle = startAngle + sliceAngle / 2;
          var textPos = polarToCartesian(200, 200, 124, midAngle);
          var fs = seg.label.length > 13 ? '9.5' : '11.5';
          return (
            '<g>' +
            '<path d="' +
            describeSlice(200, 200, 196, startAngle, endAngle) +

      function getCharacterPhotos(char) {
        var list = [char.portraitUrl].concat(char.galleryImages || []);
        var seen = {};
        return list.filter(function (u) {
          if (!u || seen[u]) return false;
          seen[u] = true;
          return true;
        });
      }

      function renderLightbox() {
        var lb = document.getElementById('lightbox-modal');
        var char = ALL_CHARACTERS.find(function (c) { return c.id === state.selectedId; });
        if (!char || state.lightboxIndex === null) {
          lb.classList.add('hidden');
          lb.innerHTML = '';
          return;
        }
        var photos = getCharacterPhotos(char);
        var url = photos[state.lightboxIndex];
        if (!url) {
          lb.classList.add('hidden');
          return;
        }
        lb.classList.remove('hidden');
        lb.innerHTML =
          '<div style="position:relative;max-width:560px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;" data-stop-prop="1">' +
          '<div style="position:relative;width:100%;max-height:80vh;border-radius:24px;overflow:hidden;border:2px solid #fff;background:#d6f1fe;display:flex;align-items:center;justify-content:center;">' +
          portraitImgHtml(url, char.name + ' - Ảnh ' + (state.lightboxIndex + 1), char.name, 'max-height:80vh;width:auto;max-width:100%;object-fit:contain;') +
          '<button type="button" id="lb-close-btn" class="glass-btn" style="position:absolute;top:12px;right:12px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;" aria-label="Đóng ảnh">' +
          icon('x', 16) +
          '</button></div>' +
          (photos.length > 1
            ? '<div style="display:flex;align-items:center;gap:12px;">' +
              '<button type="button" id="lb-prev-btn" class="glass-btn" style="padding:8px;" aria-label="Ảnh trước">' +
              icon('chevLeft', 16) +
              '</button>' +
              '<span class="glass-btn tabular-nums" style="padding:4px 16px;font-size:12px;font-weight:700;">' +
              (state.lightboxIndex + 1) +
              ' / ' +
              photos.length +
              '</span>' +
              '<button type="button" id="lb-next-btn" class="glass-btn" style="padding:8px;" aria-label="Ảnh tiếp theo">' +
              icon('chevRight', 16) +
              '</button></div>'
            : '') +
          '</div>';

        document.getElementById('lb-close-btn').onclick = function () {
          state.lightboxIndex = null;
          renderLightbox();
        };
        var prevB = document.getElementById('lb-prev-btn');
        var nextB = document.getElementById('lb-next-btn');
        if (prevB) {
          prevB.onclick = function () {
            state.lightboxIndex = state.lightboxIndex <= 0 ? photos.length - 1 : state.lightboxIndex - 1;
            renderLightbox();
          };
        }

      // =========================================================================
      var DEFAULT_TRACKS = [
        {
          id: 'default-yt-Z0HCqiEjtH4',
          title: 'Before spring ends (Piano ver.)',
          artist: 'Nguyễn Duy Thuận',
          kind: 'youtube',
          src: 'https://m.youtube.com/watch?v=Z0HCqiEjtH4&list=RDZ0HCqiEjtH4&start_radio=1',
          youtubeId: 'Z0HCqiEjtH4',
        },
      ];

      var music = {
        tracks: DEFAULT_TRACKS.concat(loadJson(KEYS.customMusic, [])),
        currentIndex: 0,
        isPlaying: true,
        repeatMode: 'all',
        isExpanded: false,
        showAddForm: false,
        waitingInteraction: false,
        volume: (loadJson(KEYS.musicPrefs, { volume: 0.65 }).volume || 0.65),
        isMuted: false,
        errorMsg: '',
        ytPlayer: null,
        ytReady: false,
        ytLoadedId: null,
      };

      function extractYouTubeId(rawUrl) {
        try {
          var u = new URL(rawUrl.trim());
          var host = u.hostname.replace(/^www\./, '').replace(/^m\./, '');
          if (host === 'youtu.be') return u.pathname.slice(1).split('/')[0] || null;
          if (host === 'youtube.com' || host === 'music.youtube.com') {
            var v = u.searchParams.get('v');
            if (v) return v;
            var parts = u.pathname.split('/').filter(Boolean);
            if (['embed', 'shorts', 'live'].indexOf(parts[0] || '') !== -1 && parts[1]) {
              return parts[1];
            }
          }
        } catch (e) {}
        return null;
      }

      function openAudioDb() {
        return new Promise(function (resolve, reject) {
          var req = window.indexedDB.open('luckyfiish_music_db_v2', 1);
          req.onupgradeneeded = function () {
            var db = req.result;
            if (!db.objectStoreNames.contains('audio_files')) {
              db.createObjectStore('audio_files', { keyPath: 'id' });
            }
          };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }

      function loadYouTubeApi() {
        return new Promise(function (resolve) {
          if (window.YT && window.YT.Player) {
            resolve(window.YT);
            return;
          }
          var prev = window.onYouTubeIframeAPIReady;
          window.onYouTubeIframeAPIReady = function () {
            if (prev) prev();
            if (window.YT) resolve(window.YT);
          };
          if (!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
            var tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            tag.async = true;
            document.head.appendChild(tag);
          }
        });
      }

      function getEffectiveVol() {
        return music.isMuted ? 0 : music.volume;
      }

      function syncMusicPlayback() {
        var active = music.tracks[music.currentIndex] || null;
        var audioEl = document.getElementById('bg-audio');
        var vol = getEffectiveVol();

        if (!active) {
          audioEl.pause();
          if (music.ytPlayer && music.ytReady) {
            try { music.ytPlayer.pauseVideo(); } catch (e) {}
          }
          renderMusicWidget();
          return;
        }

        if (active.kind === 'youtube' && active.youtubeId) {
          audioEl.pause();
          var vid = active.youtubeId;
          var syncYt = function (p) {
            try {
              p.setVolume(Math.round(vol * 100));
              if (music.isMuted || vol === 0) p.mute();
              else p.unMute();
              if (music.isPlaying) {
                p.playVideo();
                window.setTimeout(function () {
                  try {
                    var st = p.getPlayerState();
                    if (music.isPlaying && st !== 1 && st !== 3) {
                      music.waitingInteraction = true;
                      attachFirstInteractionResume();
                      renderMusicWidget();
                    }
                  } catch (e) {}
                }, 900);
              } else {
                p.pauseVideo();
                music.waitingInteraction = false;
              }
            } catch (e) {}
            renderMusicWidget();
          };

          if (music.ytPlayer && music.ytReady) {
            if (music.ytLoadedId !== vid) {
              music.ytLoadedId = vid;
              music.ytPlayer.loadVideoById(vid);
            }
            syncYt(music.ytPlayer);
          } else {
            loadYouTubeApi().then(function (YT) {
              if (music.ytPlayer) return;
              var host = document.getElementById('yt-player-host');
              music.ytLoadedId = vid;
              music.ytPlayer = new YT.Player(host, {
                width: 200,
                height: 200,
                videoId: vid,
                playerVars: {
                  autoplay: 1,
                  controls: 0,
                  disablekb: 1,
                  fs: 0,
                  modestbranding: 1,
                  playsinline: 1,
                  rel: 0,
                  enablejsapi: 1,
                },
                events: {
                  onReady: function (e) {
                    music.ytReady = true;
                    syncYt(e.target);
                  },
                  onStateChange: function (e) {
                    if (e.data === YT.PlayerState.PLAYING) {
                      music.waitingInteraction = false;
                      music.errorMsg = '';
                      renderMusicWidget();
                    } else if (e.data === YT.PlayerState.ENDED) {
                      if (music.repeatMode === 'one' || music.tracks.length <= 1) {
                        e.target.seekTo(0, true);
                        e.target.playVideo();
                      } else {
                        music.currentIndex = music.currentIndex >= music.tracks.length - 1 ? 0 : music.currentIndex + 1;
                        music.isPlaying = true;
                        syncMusicPlayback();
                      }
                    }
                  },
                  onError: function () {
                    music.errorMsg = 'Không thể phát bài YouTube này.';
                    music.isPlaying = false;
                    renderMusicWidget();
                  },
                },
              });
            });
          }
          return;
        }

        // Audio URL or Local File
        if (music.ytPlayer && music.ytReady) {
          try { music.ytPlayer.pauseVideo(); } catch (e) {}
        }
        audioEl.volume = vol;
        audioEl.loop = music.repeatMode === 'one' || music.tracks.length === 1;
        if (audioEl.src !== active.src) audioEl.src = active.src;
        if (music.isPlaying) {
          audioEl
            .play()
            .then(function () {
              music.waitingInteraction = false;
              music.errorMsg = '';
              renderMusicWidget();
            })
            .catch(function () {
              music.waitingInteraction = true;
              attachFirstInteractionResume();
              renderMusicWidget();
            });
        } else {
          audioEl.pause();
          music.waitingInteraction = false;
          renderMusicWidget();
        }
      }

      var resumeBound = false;
      function attachFirstInteractionResume() {
        if (resumeBound) return;
        resumeBound = true;
        var resume = function () {
          resumeBound = false;
          window.removeEventListener('pointerdown', resume);
          window.removeEventListener('keydown', resume);
          if (!music.waitingInteraction || !music.isPlaying) return;
          var active = music.tracks[music.currentIndex];
          if (!active) return;
          if (active.kind === 'youtube' && music.ytPlayer && music.ytReady) {
            try {
              if (!music.isMuted && getEffectiveVol() > 0) music.ytPlayer.unMute();
              music.ytPlayer.setVolume(Math.round(getEffectiveVol() * 100));
              music.ytPlayer.playVideo();
              music.waitingInteraction = false;
              renderMusicWidget();
            } catch (e) {}
          } else {
            var a = document.getElementById('bg-audio');
            a.play().then(function () {
              music.waitingInteraction = false;
              renderMusicWidget();
            }).catch(function () {});
          }
        };
        window.addEventListener('pointerdown', resume);
        window.addEventListener('keydown', resume);
      }

              e.preventDefault();
              var rawUrl = (document.getElementById('music-new-url').value || '').trim();
              var rawTitle = (document.getElementById('music-new-title').value || '').trim();
              if (!rawUrl) return;
              var ytId = extractYouTubeId(rawUrl);
              var tr = ytId
                ? { id: 'yt-' + Date.now(), title: rawTitle || 'Nhạc YouTube của bạn', artist: 'YouTube', kind: 'youtube', src: rawUrl, youtubeId: ytId }
                : { id: 'url-' + Date.now(), title: rawTitle || 'Bài hát của bạn', artist: 'Liên kết nhạc', kind: 'url', src: rawUrl };
              music.tracks.push(tr);
              music.currentIndex = music.tracks.length - 1;
              music.showAddForm = false;
              music.isPlaying = true;
              saveJson(
                KEYS.customMusic,
                music.tracks.filter(function (x) { return (x.kind === 'url' || x.kind === 'youtube') && x.id.indexOf('default-') !== 0; })
              );
              syncMusicPlayback();
            };
          }

          var fileInp = document.getElementById('music-file-input');
          if (fileInp) {
            fileInp.onchange = function (e) {
              var f = e.target.files && e.target.files[0];
              if (!f) return;
              var id = 'file-' + Date.now();
              var title = f.name.replace(/\.[^/.]+$/, '') || 'Nhạc tải lên';
              var url = URL.createObjectURL(f);
              music.tracks.push({ id: id, title: title, artist: 'Từ thiết bị', kind: 'file', src: url });
              music.currentIndex = music.tracks.length - 1;
              music.showAddForm = false;
              music.isPlaying = true;
              openAudioDb().then(function (db) {
                var tx = db.transaction('audio_files', 'readwrite');
                tx.objectStore('audio_files').put({ id: id, title: title, artist: 'Từ thiết bị', blob: f });
                db.close();
              }).catch(function () {});
              syncMusicPlayback();
            };
          }
        }
      }

      // =========================================================================
      // 11. EVENT DELEGATION & KHỞI TẠO ỨNG DỤNG
      // =========================================================================
      document.addEventListener('click', function (e) {
        var el = e.target;
        if (!el || !el.closest) return;

        var tagBtn = el.closest('[data-tag-select]');
        if (tagBtn) {
          e.stopPropagation();
          handleToggleTag(tagBtn.getAttribute('data-tag-select'));
          return;
        }

        var unlockBtn = el.closest('[data-unlock-char]');
        if (unlockBtn) {
          e.stopPropagation();
          handleUnlockCharacter(unlockBtn.getAttribute('data-unlock-char'));
          return;
        }

        var visitLink = el.closest('[data-visit-unlock]');
        if (visitLink) {
          e.stopPropagation();
          handleVisitUnlockLink(visitLink.getAttribute('data-visit-unlock'));
          return;
        }

        var lbBtn = el.closest('[data-open-lb]');
        if (lbBtn) {
          e.stopPropagation();
          state.lightboxIndex = Number(lbBtn.getAttribute('data-open-lb'));
          renderLightbox();
          return;
        }

        var openChar = el.closest('[data-open-char]');
        if (openChar && !el.closest('[data-stop-prop]')) {
          openCharacter(openChar.getAttribute('data-open-char'));
          return;
        }

        var mSel = el.closest('[data-music-select]');
        if (mSel) {
          music.currentIndex = Number(mSel.getAttribute('data-music-select'));
          music.isPlaying = true;
          syncMusicPlayback();
          return;
        }

        var mDel = el.closest('[data-music-del]');
        if (mDel) {
          var idx = Number(mDel.getAttribute('data-music-del'));
          var rem = music.tracks[idx];
          if (rem && rem.id.indexOf('default-') !== 0) {
            music.tracks.splice(idx, 1);
            if (music.currentIndex >= music.tracks.length) music.currentIndex = Math.max(0, music.tracks.length - 1);
            saveJson(
              KEYS.customMusic,
              music.tracks.filter(function (x) { return (x.kind === 'url' || x.kind === 'youtube') && x.id.indexOf('default-') !== 0; })
            );
            if (rem.id.indexOf('file-') === 0) {
              openAudioDb().then(function (db) {
                db.transaction('audio_files', 'readwrite').objectStore('audio_files').delete(rem.id);
                db.close();
              }).catch(function () {});
            }
            syncMusicPlayback();
          }
          return;
        }

        if (el.id === 'detail-modal') {
          state.selectedId = null;
          renderDetailModal();
        } else if (el.id === 'lightbox-modal') {
          state.lightboxIndex = null;
          renderLightbox();
        }
      });

      document.addEventListener('submit', function (e) {
        var form = e.target;
        if (form && form.hasAttribute('data-gallery-pw-form')) {
          e.preventDefault();
          e.stopPropagation();
          var charId = form.getAttribute('data-gallery-pw-form');
          var inp = form.querySelector('input');
          var res = verifyPassword(charId, inp ? inp.value : '');
          state.galleryPasswordErrors[charId] = res.ok ? '' : res.message || 'Mật khẩu chưa đúng.';
          renderMain();
        }
      });

      document.addEventListener('keydown', function (e) {
        if (!state.selectedId) return;
        var char = ALL_CHARACTERS.find(function (c) { return c.id === state.selectedId; });
        if (!char) return;
        var photos = getCharacterPhotos(char);
        var pool = getVisibleRosterPool();
        var idx = pool.findIndex(function (c) { return c.id === char.id; });

        if (e.key === 'Escape') {
          if (state.lightboxIndex !== null) {
            state.lightboxIndex = null;
            renderLightbox();
          } else {
            state.selectedId = null;
            renderDetailModal();
          }
        } else if (e.key === 'ArrowLeft') {
          if (state.lightboxIndex !== null && photos.length > 1) {
            state.lightboxIndex = state.lightboxIndex <= 0 ? photos.length - 1 : state.lightboxIndex - 1;
            renderLightbox();
          } else if (state.lightboxIndex === null && pool.length > 1) {
            openCharacter(pool[idx <= 0 ? pool.length - 1 : idx - 1].id);
          }
        } else if (e.key === 'ArrowRight') {
          if (state.lightboxIndex !== null && photos.length > 1) {
            state.lightboxIndex = state.lightboxIndex >= photos.length - 1 ? 0 : state.lightboxIndex + 1;
            renderLightbox();
          } else if (state.lightboxIndex === null && pool.length > 1) {
            openCharacter(pool[idx >= pool.length - 1 ? 0 : idx + 1].id);
          }
        }
      });

      // Nav tabs & Brand & Name Edit
      document.querySelectorAll('[data-tab]').forEach(function (btn) {
        btn.onclick = function () {
          state.activeTab = btn.getAttribute('data-tab');
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      document.getElementById('brand-home-btn').onclick = function () {
        state.activeTab = 'nhan-vat';
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      document.getElementById('nav-name-btn').onclick = function () {
        state.isEditingName = true;
        state.nameError = '';
        renderGateModals();
      };

      document.getElementById('bg-audio').addEventListener('ended', function () {
        if (music.tracks.length === 0) return;
        if (music.repeatMode === 'one' || music.tracks.length === 1) {
          this.currentTime = 0;
          this.play();
        } else {
          music.currentIndex = music.currentIndex >= music.tracks.length - 1 ? 0 : music.currentIndex + 1;
          syncMusicPlayback();
        }
      });

      // Load local audio files from IndexedDB if any
      openAudioDb()
        .then(function (db) {
          var req = db.transaction('audio_files', 'readonly').objectStore('audio_files').getAll();
          req.onsuccess = function () {
            var recs = req.result || [];
            recs.forEach(function (r) {
              if (!music.tracks.some(function (t) { return t.id === r.id; })) {
                music.tracks.push({
                  id: r.id,
                  title: r.title,
                  artist: r.artist,
                  kind: 'file',
                  src: URL.createObjectURL(r.blob),
                });
              }
            });
            renderMusicWidget();
            db.close();
          };
        })
        .catch(function () {});

      // Khởi chạy giao diện
      initAtmosphere();
      renderAll();
      renderMusicWidget();
      syncMusicPlayback();
    })();
  </script>
</body>
</html>
